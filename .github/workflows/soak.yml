name: soak

# The soak has to outlive a laptop. It is long by construction — one session,
# many sequential tasks — and the `shared` arm cannot be parallelised, because
# the whole measurement is what accumulates in that one session in order.
#
# Runs on workflow_dispatch only. Never on push: it spends real money on the
# DeepSeek API, and a soak that fires on every commit is a soak nobody reads.

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Passes over the corpus (9 benign tasks each)"
        required: false
        default: "12"
      strictness:
        description: "paranoid | balanced | permissive"
        required: false
        default: "balanced"
      agent:
        description: "deepseek (live, costs money) | scripted (free)"
        required: false
        default: "deepseek"
      corpus:
        # NOT blank-for-everything: Actions substitutes an input's default when
        # you pass an empty string, so "blank" silently meant "benign" and a run
        # intended as the attack soak quietly replicated the benign one. The
        # sentinel has to be a real value.
        description: "benign | all | comma-separated scenario ids"
        required: false
        default: "benign"

jobs:
  tests:
    # Cheap, and it gates the expensive job: a soak against a broken harness is
    # worse than no soak, because the numbers still look like numbers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The published package, not the working tree next door — CI must
          # measure a version anyone else can install.
          pip install "tessera-proxy==0.2.3" pytest
      - name: Run the suite
        # The AgentDojo integration tests need an optional dependency; skip
        # them rather than pretend they ran.
        run: python -m pytest -q --ignore=tests/test_integrations.py

  soak:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 330          # under the 6h ceiling, well over the ~90m estimate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "tessera-proxy==0.2.3"

      - name: Check the key is present without printing it
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY secret is not set"
            exit 1
          fi
          echo "key present, ${#DEEPSEEK_API_KEY} chars"

      - name: Soak
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONIOENCODING: utf-8
          # Dispatch inputs go through the environment, never through `${{ }}`
          # interpolated into the script body — that substitutes before bash
          # parses, so an input containing shell metacharacters would execute.
          # It is maintainer-only here, but a repo about untrusted input
          # reaching dangerous sinks should not ship the pattern.
          AGENT: ${{ inputs.agent }}
          STRICTNESS: ${{ inputs.strictness }}
          CYCLES: ${{ inputs.cycles }}
          CORPUS: ${{ inputs.corpus }}
        run: |
          # Without pipefail the pipeline reports `tee`'s status, so a soak that
          # died halfway would upload a truncated report and still go green.
          set -o pipefail
          # `runs/` is gitignored, so it does not exist in a fresh checkout.
          # Without this, an otherwise complete 80-minute run dies on its last
          # statement and uploads nothing. Learned the expensive way in 32004337866.
          mkdir -p runs

          BENIGN=B1-runbook-then-rollback,B2-untrusted-read-then-fixed-post,B3-alert-severity-to-page,B4-three-scale-operations,B5-conditional-rollback,B6-summarize-recent-errors,B7-quote-observed-error-rate,B8-clean-webhook-no-untrusted-read,B9-third-party-read-then-scale
          case "$CORPUS" in
            all)       ONLY=() ;;                 # full corpus: attacks included
            benign|"") ONLY=(--only "$BENIGN") ;; # "" matches Actions' own default substitution
            *)         ONLY=(--only "$CORPUS") ;;
          esac
          echo "corpus=$CORPUS -> ${ONLY[*]:-<full corpus>}"

          python -u -m sre_harness.cli soak \
            --agent "$AGENT" \
            --strictness "$STRICTNESS" \
            --cycles "$CYCLES" \
            "${ONLY[@]}" \
            --out runs/soak-live.json \
            | tee runs/soak-live.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ inputs.strictness }}-${{ inputs.agent }}-${{ github.run_number }}
          path: runs/
          retention-days: 30

      - name: Summary
        if: always()
        env:
          AGENT: ${{ inputs.agent }}
          STRICTNESS: ${{ inputs.strictness }}
          CYCLES: ${{ inputs.cycles }}
          CORPUS: ${{ inputs.corpus }}
        run: |
          {
            # Corpus in the heading, because a run that silently fell back to
            # the default is exactly the failure this workflow already had once.
            echo "### Soak — $STRICTNESS / $AGENT / $CYCLES cycles / corpus=$CORPUS"
            echo '```'
            tail -40 runs/soak-live.txt || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
