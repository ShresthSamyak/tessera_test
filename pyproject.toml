[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-harness"
version = "0.1.0"
description = "Prompt-injection evaluation harness for an autonomous SRE / incident-response agent"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sre_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["sre_harness", "tests"]
extraPaths = ["."]
reportMissingImports = "warning"
